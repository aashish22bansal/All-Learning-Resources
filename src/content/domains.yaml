# Domain registry.
#
# Add a line to add a domain. Nothing else needs to change — the schema, the
# colours, the filters, the domain pages and the folder layout all read this file.
#
#   name   required. Shown everywhere.
#   short  required. 2-3 characters. Carries the identity on badges, because
#          colour alone stops distinguishing domains somewhere past fifteen.
#   blurb  optional. One line, shown on the domain page.
#   parent optional. One level only. A child's notes live under the parent's
#          folder, and it inherits the parent's hue so the family reads together.
#   hue    optional. 0-359. Pin it on a root to fix that family's colour. Pinning
#          it on a child overrides the inherited hue and costs the family cue.
#   color  optional. Full override, escapes the generator entirely.
#
# Colour is hue-per-family, lightness-per-member. A family holds a root plus
# about five children before its members stop separating by lightness — past
# that the short code is doing the identifying. `data-engineering` and
# `programming` are both at that limit already.
#
# Tags do the fine-grained work. "rag", "jvm", "indexing" are tags, not domains.

